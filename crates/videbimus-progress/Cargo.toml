[package]
name = "videbimus-progress"
description = "videbimus's logs and progress: the run event log, the progress tree, the live terminal view, the status file and `status`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
videbimus-core = { path = "../videbimus-core" }
videbimus-store = { path = "../videbimus-store" }
videbimus-scheduler = { path = "../videbimus-scheduler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
